<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<title>EduVerse — Календарь олимпиад</title>
<style>
:root{--navy:#102f67;--orange:#ff7900;--yellow:#ffd229;--bg:#fffaf2;--white:#fff;--muted:#718096;--line:#e7ebf1}
*{box-sizing:border-box}body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy)}
.app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:40px}
header{padding:18px 16px 12px;background:white;border-bottom:1px solid var(--line)}
.logo{font-size:21px;font-weight:950}.logo em{font-style:normal;color:var(--orange)}
h1{font-size:27px;line-height:1.05;margin:18px 0 6px}.intro{font-size:13px;color:var(--muted);margin:0}
.months{display:flex;gap:8px;overflow:auto;padding:15px 16px 10px;scrollbar-width:none}.months::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:white;color:var(--navy);border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:850}.chip.active{background:var(--navy);color:white;border-color:var(--navy)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 13px}select{width:100%;min-width:0;border:1px solid var(--line);border-radius:14px;background:white;color:var(--navy);padding:12px;font-size:16px}
.head{display:flex;justify-content:space-between;align-items:end;padding:4px 16px 10px}.head b{font-size:19px}.head span{font-size:11px;color:var(--muted)}
.events{padding:0 16px}.event{width:100%;border:1px solid var(--line);background:white;border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:9px;color:var(--navy)}
.date{width:67px;flex:none;border-radius:15px;background:#fff0d9;text-align:center;padding:10px 4px;color:var(--orange);font-size:18px;font-weight:950}.date small{display:block;color:var(--navy);font-size:8px;margin-top:5px}
.info{flex:1;min-width:0}.info strong{font-size:14px}.info p{font-size:10px;color:var(--muted);margin:4px 0 0;line-height:1.35}.arr{font-size:24px;color:var(--orange)}
.detail{display:none;padding:0 16px}.detail.show{display:block}.back{border:0;background:transparent;color:var(--orange);font-weight:900;padding:12px 0;min-height:44px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:18px}.kicker{font-size:10px;color:var(--orange);font-weight:900;letter-spacing:.08em}.card h2{font-size:25px;margin:6px 0}.meta{font-size:12px;color:var(--muted);line-height:1.5}
.timeline{margin:20px 0}.stage{display:flex;gap:12px;padding:7px 0 13px}.dot{width:13px;height:13px;background:var(--orange);border-radius:50%;box-shadow:0 0 0 4px #fff0da;margin-top:2px;flex:none}.stage b{font-size:13px}.stage p{font-size:10px;color:var(--muted);margin:3px 0}
.price{background:#fff3bd;border-radius:17px;padding:14px;margin-top:8px}.price b{font-size:13px}.price p{font-size:11px;color:var(--muted);margin:5px 0 0}
.cta{display:block;width:100%;border:0;border-radius:14px;background:var(--orange);color:white;font-weight:950;padding:14px;margin-top:12px;font-size:14px;text-align:center;text-decoration:none}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.secondary a{display:block;border:1px solid var(--line);background:white;border-radius:13px;color:var(--navy);padding:12px;font-weight:850;text-align:center;text-decoration:none}.notice{display:none;font-size:11px;color:var(--muted);text-align:center;margin-top:10px}.empty{text-align:center;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body><main class="app">
<header><div class="logo"><em>edu</em>verse</div><h1>Календарь международных олимпиад</h1><p class="intro">2026–2027 учебный год · выберите месяц и нажмите на олимпиаду</p></header>
<section id="list">
<div class="months" id="months"></div>
<div class="filters"><select id="subject"><option value="Все">Все предметы</option><option>Математика</option><option>Английский</option><option>Естествознание</option><option>Физика</option><option>Химия</option></select><select id="grade"><option value="Все">Все классы</option><option>1</option><option>3</option><option>5</option><option>7</option><option>9</option><option>12</option></select></div>
<div class="head"><b id="monthTitle">Все даты</b><span id="count"></span></div><div class="events" id="events"></div>
</section>
<section class="detail" id="detail"><button class="back" id="back">← Назад к календарю</button><div class="card"><div class="kicker" id="dsub"></div><h2 id="dname"></h2><div class="meta" id="dmeta"></div><div class="timeline" id="timeline"></div><div class="price"><b>Стоимость участия</b><p>В рабочей версии здесь отображаются актуальные индивидуальная цена, цена школы-партнёра и Early Bird, если он действует.</p></div><a class="cta" id="register" href="#">Зарегистрироваться →</a><div class="secondary"><a id="rules" href="#" target="_blank" rel="noopener">Положение</a><a id="materials" href="#" target="_blank" rel="noopener">Презентация</a></div><div class="notice" id="notice"></div></div></section>
</main>
<script>
const data=[
{name:'Brainiacs',date:'25–26',month:'Сентябрь',country:'Малайзия 🇲🇾',sub:['Английский'],grades:'3–12',registerUrl:'https://app.eduverse.kz/competition/details?productId=987&ref=169291',rulesUrl:'https://docs.google.com/document/d/1cwpraPSA_kMk3sUp-F8KyImPqVHJM4tr/edit#heading=h.p3xen8vh9qns',presentationUrl:'https://docs.google.com/presentation/d/1zUrrsQ78RVSywDqKlbcWFD9kiWhJNkl0b-gb9RAnI5I/edit?usp=sharing'},
{name:'STEMCO English',date:'25–26',month:'Сентябрь',country:'Сингапур 🇸🇬',sub:['Английский'],grades:'1–12'},
{name:'FMO',date:'02–03',month:'Октябрь',country:'Вьетнам 🇻🇳',sub:['Математика'],grades:'1–12'},
{name:'TeenEagle',date:'09–10',month:'Октябрь',country:'Великобритания 🇬🇧 · Малайзия 🇲🇾 · Турция 🇹🇷',sub:['Английский','Математика'],grades:'3–12 / 1–10'},
{name:'Olympiad USA',date:'09–10',month:'Октябрь',country:'США 🇺🇸',sub:['Математика','Английский'],grades:'3–12'},
{name:'Copernicus',date:'10–11',month:'Октябрь',country:'США 🇺🇸 · Турция 🇹🇷',sub:['Естествознание','Физика'],grades:'3–12 / 7–12'},
{name:'NextGen Olympiad',date:'16–17',month:'Октябрь',country:'Австралия 🇦🇺',sub:['Математика','Естествознание','Английский'],grades:'1–12'},
{name:'STEMCO Sciences',date:'13–14',month:'Ноябрь',country:'Сингапур 🇸🇬',sub:['Естествознание','Химия','Физика'],grades:'1–8 / 9–12'},
{name:'Copernicus',date:'14–15',month:'Ноябрь',country:'США 🇺🇸 · Турция 🇹🇷',sub:['Естествознание','Физика'],grades:'3–12 / 7–12'},
{name:'Olympiad USA',date:'20–21',month:'Ноябрь',country:'США 🇺🇸',sub:['Математика','Английский'],grades:'3–12'},
{name:'Copernicus Astronomy',date:'21',month:'Ноябрь',country:'США 🇺🇸 · Турция 🇹🇷',sub:['Физика'],grades:'7–12'},
{name:'Brainiacs',date:'27–28',month:'Ноябрь',country:'Малайзия 🇲🇾',sub:['Математика','Химия','Физика'],grades:'3–12 / 7–12'},
{name:'TeenEagle',date:'4–5',month:'Декабрь',country:'Великобритания 🇬🇧 · Малайзия 🇲🇾 · Турция 🇹🇷',sub:['Английский','Математика'],grades:'3–12 / 1–10'}];
const monthNames=['Все','Сентябрь','Октябрь','Ноябрь','Декабрь'];let activeMonth='Все';
const months=document.getElementById('months'),events=document.getElementById('events'),subject=document.getElementById('subject'),grade=document.getElementById('grade');
function gradeOK(s,g){if(g==='Все')return true;return s.split('/').some(p=>{let a=p.match(/\d+/g);return a&&+g>=+a[0]&&+g<=+(a[1]||a[0])})}
function renderMonths(){months.innerHTML='';monthNames.forEach(m=>{let b=document.createElement('button');b.className='chip '+(m===activeMonth?'active':'');b.textContent=m;b.onclick=()=>{activeMonth=m;render()};months.appendChild(b)})}
function render(){renderMonths();let arr=data.filter(x=>(activeMonth==='Все'||x.month===activeMonth)&&(subject.value==='Все'||x.sub.includes(subject.value))&&gradeOK(x.grades,grade.value));document.getElementById('monthTitle').textContent=activeMonth==='Все'?'Все даты':activeMonth;document.getElementById('count').textContent=arr.length+' событий';events.innerHTML='';if(!arr.length){events.innerHTML='<div class="empty">По этим фильтрам событий нет</div>';return}arr.forEach(x=>{let b=document.createElement('button');b.className='event';b.innerHTML=`<div class="date">${x.date}<small>${x.month.toUpperCase()}</small></div><div class="info"><strong>${x.name}</strong><p>${x.sub.join(' · ')} · ${x.grades} класс</p><p>${x.country}</p></div><span class="arr">›</span>`;b.onclick=()=>openDetail(x);events.appendChild(b)})}
function openDetail(x){document.getElementById('list').style.display='none';document.getElementById('detail').classList.add('show');document.getElementById('dsub').textContent=x.sub.join(' · ');document.getElementById('dname').textContent=x.name;document.getElementById('dmeta').textContent=x.grades+' класс · '+x.country;document.getElementById('timeline').innerHTML=`<div class="stage"><i class="dot"></i><div><b>${x.date} ${x.month.toLowerCase()}</b><p>Отборочный этап</p></div></div><div class="stage"><i class="dot" style="background:#ffd229"></i><div><b>Следующий этап / Global Round</b><p>Точные даты и формат будут отображаться из данных олимпиады</p></div></div>`;
const register=document.getElementById('register'),rules=document.getElementById('rules'),materials=document.getElementById('materials');
const notice=document.getElementById('notice');notice.style.display='none';
[[register,x.registerUrl],[rules,x.rulesUrl],[materials,x.presentationUrl]].forEach(([el,url])=>{if(url){el.href=url;el.style.opacity='1';el.style.pointerEvents='auto'}else{el.removeAttribute('href');el.style.opacity='.45';el.style.pointerEvents='none'}});
window.scrollTo(0,0)}
document.getElementById('back').onclick=()=>{document.getElementById('detail').classList.remove('show');document.getElementById('list').style.display='block';window.scrollTo(0,0)}
subject.onchange=render;grade.onchange=render;
render();
</script></body></html>
